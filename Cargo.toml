[package]
name = "vaporator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Discord notifications for Steam builds and official news"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
poise = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
steam-vent = "0.5"
steam-vent-proto-steam = "0.5.2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vdf-reader = "0.3.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

