name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Validate release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check version and release branch
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Expected a stable major.minor.patch package version")
          if os.environ["REF_TYPE"] == "tag":
              if os.environ["REF_NAME"] != f"v{version}":
                  raise SystemExit("Release tag must match the Cargo.toml version")
              subprocess.run(
                  ["git", "merge-base", "--is-ancestor", "HEAD", "origin/master"],
                  check=True,
              )
          PY
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy && rustup default 1.88.0
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: check
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: vaporator
            rustflags: ''
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: vaporator.exe
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal && rustup default 1.88.0
      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - name: Build executable
        env:
          TARGET: ${{ matrix.target }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Check executable
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          "target/$TARGET/release/$BINARY" --version
          "target/$TARGET/release/$BINARY" --help
      - name: Package executable and setup guide
        env:
          TARGET: ${{ matrix.target }}
        run: python scripts/package_release.py --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Create draft, attach binaries, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > is-draft.txt; then
            if [ "$(cat is-draft.txt)" != "true" ]; then
              echo "Release is already published; refusing to replace its assets."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Vaporator $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
